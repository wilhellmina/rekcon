<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reckon">
<meta name="format-detection" content="telephone=no">
<title>Reckon</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f3f5;
    --panel: #ffffff;
    --text: #111418;
    --muted: #5b6470;
    --line: #d8dce2;
    --accent: #0a5fd1;
    --on-accent: #ffffff;
    --ok: #13803b;
    --warn: #a85a00;
    --bad: #c62828;
    --mono-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013;
      --panel: #181b20;
      --text: #eef1f5;
      --muted: #9aa4b1;
      --line: #2c313a;
      --accent: #4a92ff;
      --on-accent: #06101f;
      --ok: #4cc574;
      --warn: #f0a443;
      --bad: #ff6b6b;
      --mono-bg: #121519;
    }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
  h1 { font-size: 20px; margin: 0; }
  h1 small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .top select {
    /* iOS は 16px 未満の入力欄を触ると拡大するので 16px */
    font: inherit;
    font-size: 16px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
  }
  .modes { display: flex; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .modes button { flex: 1; min-height: 44px; border: 0; border-radius: 0; background: transparent; }
  .modes button + button { border-left: 1px solid var(--line); }
  .modes button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .step { font-size: 13px; color: var(--muted); }
  .prompt { font-size: 26px; font-weight: 700; line-height: 1.3; margin: 2px 0 4px; }
  .sub { color: var(--muted); min-height: 1.5em; }
  .sub.warn { color: var(--warn); }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
  .live { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 14px; }
  .live span { display: block; font-size: 12px; color: var(--muted); }
  .live b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 10px; margin: 14px 0; }
  .actions button { flex: 1; }
  button {
    font: inherit;
    font-weight: 600;
    min-height: 52px;
    padding: 0 18px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    touch-action: manipulation;
  }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  button:disabled { opacity: .5; }
  .label { font-size: 13px; color: var(--muted); }
  .big { font-size: 44px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .result { margin-bottom: 12px; }
  .result table { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .result th { text-align: left; font-weight: 400; color: var(--muted); padding: 6px 10px 6px 0; white-space: nowrap; vertical-align: top; }
  .result td { padding: 6px 0; }
  .result tr + tr > * { border-top: 1px solid var(--line); }
  .result .notes p { margin: 10px 0 0; }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  details.card { padding: 0; margin-top: 12px; }
  summary { padding: 14px 16px; font-weight: 600; cursor: pointer; }
  .inner { padding: 0 16px 16px; }
  .form label { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .form label > span:last-child { white-space: nowrap; }
  .form input {
    font: inherit;
    width: 5.5em;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    text-align: right;
  }
  .form select {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  .form .unit { color: var(--muted); font-size: 14px; }
  .form .note { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .form button { margin-top: 8px; width: 100%; }
  pre.dbg {
    font: 12px/1.45 ui-monospace, Menlo, monospace;
    background: var(--mono-bg);
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0 0 10px;
  }
  .log { font: 12px/1.45 ui-monospace, Menlo, monospace; max-height: 16em; overflow-y: auto; margin-bottom: 10px; overflow-wrap: anywhere; }
  .inner > button { width: 100%; }
  ol.help { padding-left: 1.3em; margin: 0; }
  ol.help li + li { margin-top: 6px; }
  @keyframes flash { from { background: var(--ok); } }
  .flash { animation: flash .6s ease-out; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Reckon<small data-i18n="subtitle">アライメント測定(お試し版)</small></h1>
    <select id="langSel" aria-label="Language / 言語">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </header>

  <div class="modes" role="group">
    <button id="modeToe" data-i18n="modeToe" aria-pressed="true">トー</button>
    <button id="modeCam" data-i18n="modeCam" aria-pressed="false">キャンバー</button>
  </div>

  <section class="card" id="statusBox">
    <div class="step" id="step"></div>
    <div class="prompt" id="prompt"></div>
    <div class="sub" id="sub"></div>
    <div class="bar" id="bar" hidden><i id="barFill"></i></div>
    <div class="live" id="live" hidden>
      <div id="boxWobble"><span data-i18n="liveWobble">ゆれ</span><b id="liveWobble">–</b></div>
      <div id="boxCam"><span data-i18n="liveCam">キャンバー(今)</span><b id="liveCam">–</b></div>
      <div id="boxTravel"><span data-i18n="liveTravel">移動時間</span><b id="liveTravel">–</b></div>
      <div id="boxToe"><span data-i18n="liveToe">トータルトー(今)</span><b id="liveToe">–</b></div>
    </div>
  </section>

  <div class="actions">
    <button class="primary" id="btnStart" data-i18n="btnStart">センサー開始</button>
    <button id="btnReset" data-i18n="btnReset" hidden>左からやり直す</button>
    <button id="btnForceL" data-i18n="btnForceL" hidden>ここが左前輪</button>
    <button id="btnFlip" data-i18n="btnFlip" hidden>上下逆にしてもう1回</button>
    <button class="primary" id="btnAgain" data-i18n="btnAgain" hidden>もう一度測る</button>
  </div>

  <section class="card result" id="resultToe" hidden>
    <div class="label" data-i18n="resToe">トータルトー(トーイン正)</div>
    <div class="big" id="rToe">–</div>
    <div id="rToeSub"></div>
    <table>
      <tr><th data-i18n="resTravel">移動時間</th><td id="rTravel"></td></tr>
      <tr><th data-i18n="resSdL">ばらつき 左</th><td id="rSdL"></td></tr>
      <tr><th data-i18n="resSdR">ばらつき 右</th><td id="rSdR"></td></tr>
      <tr><th data-i18n="resPsi">向き ψ 左 / 右</th><td id="rPsi"></td></tr>
    </table>
    <div class="notes" id="rNotes"></div>
  </section>

  <section class="card result" id="resultCam" hidden>
    <div class="label" data-i18n="resCam">キャンバー(ネガが負)</div>
    <div class="big" id="rCam">–</div>
    <div id="rCamSub"></div>
    <table>
      <tr id="rowCam1"><th data-i18n="resCam1">1回目</th><td id="rCam1"></td></tr>
      <tr id="rowCam2"><th data-i18n="resCam2">2回目(上下逆)</th><td id="rCam2"></td></tr>
      <tr id="rowOffset"><th data-i18n="resOffset">付け方の傾き</th><td id="rOffset"></td></tr>
      <tr><th data-i18n="resSdC">ばらつき</th><td id="rSdC"></td></tr>
    </table>
  </section>

  <details class="card" id="settingsBox">
    <summary data-i18n="settings">設定</summary>
    <div class="inner form">
      <p class="note" data-i18n="settingsNote">変えた値はこの端末に保存されます。</p>
      <label><span data-i18n="setStillTol">静止とみなすゆれ</span>
        <span><input id="setStillTol" type="number" inputmode="decimal" step="0.01"> <span class="unit" data-i18n="unitStillTol">° 以内</span></span></label>
      <label><span data-i18n="setStillSec">静止を続ける時間</span>
        <span><input id="setStillSec" type="number" inputmode="decimal" step="0.1"> <span class="unit" data-i18n="unitSec">秒</span></span></label>
      <label><span data-i18n="setMaxTilt">傾きの許容(棒は水平、面は垂直から)</span>
        <span><input id="setMaxTilt" type="number" inputmode="decimal" step="1"> <span class="unit">°</span></span></label>
      <label><span data-i18n="setToeEdge">トー:棒に沿わせる辺</span>
        <span><select id="setToeEdge">
          <option value="long" data-i18n="edgeLong">長い辺</option>
          <option value="short" data-i18n="edgeShort">短い辺</option>
        </select></span></label>
      <label><span data-i18n="setTravelWarn">トー:移動時間の警告</span>
        <span><input id="setTravelWarn" type="number" inputmode="decimal" step="1"> <span class="unit" data-i18n="unitSec">秒</span></span></label>
      <label><span data-i18n="setRim">トー:リム径(空欄なら mm 換算なし)</span>
        <span><input id="setRim" type="number" inputmode="decimal" step="0.5"> <span class="unit" data-i18n="unitInch">インチ</span></span></label>
      <button id="btnDefaults" data-i18n="btnDefaults">初期値に戻す</button>
    </div>
  </details>

  <details class="card" id="debugBox" open>
    <summary data-i18n="debug">デバッグ</summary>
    <div class="inner">
      <pre class="dbg" id="dbg"></pre>
      <div class="log" id="log"></div>
      <button id="btnCopy" data-i18n="btnCopy">表示とログをコピー</button>
    </div>
  </details>

  <details class="card">
    <summary data-i18n="help">使い方</summary>
    <div class="inner">
      <ol class="help">
        <li data-i18n="help1"></li>
        <li data-i18n="help2"></li>
        <li data-i18n="help3"></li>
        <li data-i18n="help4"></li>
      </ol>
    </div>
  </details>
</main>

<script>
'use strict';

const $ = (id) => document.getElementById(id);

// --- math:start ---
const DEG = Math.PI / 180;

/** (−180°, 180°] に正規化する */
function wrap180(d) {
  const x = ((d + 180) % 360 + 360) % 360 - 180;
  return x === -180 ? 180 : x;
}

/**
 * 画面の法線(デバイスの z 軸。画面側が正)の世界座標。世界座標は z が上。
 * W3C の Z-X'-Y'' 順の回転行列 R = Rz(α)·Rx(β)·Ry(γ) の3列目。
 * オイラー角は縦にしたとき(β≈90°)ジンバルロック付近になるので、向きには必ずこのベクトルを使う。
 */
function normalFromEuler(alpha, beta, gamma) {
  const a = alpha * DEG, b = beta * DEG, g = gamma * DEG;
  const sA = Math.sin(a), cA = Math.cos(a);
  const sB = Math.sin(b), cB = Math.cos(b);
  const sG = Math.sin(g), cG = Math.cos(g);
  return [cG * sA * sB + cA * sG, sA * sG - cA * cG * sB, cB * cG];
}

/**
 * 画面の右(デバイスの x 軸。縦持ちで短い辺の向き)と上(y 軸。長い辺の向き)の世界座標。R の1列目と2列目。
 * トーは、棒に沿わせた辺の向きで測る(棒を軸にあおっても、平らに置いても変わらない)。
 */
function axesFromEuler(alpha, beta, gamma) {
  const a = alpha * DEG, b = beta * DEG, g = gamma * DEG;
  const sA = Math.sin(a), cA = Math.cos(a);
  const sB = Math.sin(b), cB = Math.cos(b);
  const sG = Math.sin(g), cG = Math.cos(g);
  return [
    [cA * cG - sA * sB * sG, cG * sA + cA * sB * sG, -cB * sG],
    [-cB * sA, cA * cB, sB],
  ];
}

/** 水平方向の向き ψ(上から見て反時計回り、度) */
function headingOf(n) {
  return Math.atan2(n[1], n[0]) / DEG;
}

/** キャンバー(ネガ=負、度)。左右とも同じ式 */
function camberOf(n) {
  return -Math.asin(Math.max(-1, Math.min(1, n[2]))) / DEG;
}

/**
 * トータルトー(トーイン正、度)。
 * 差を先に正規化すると、トーアウトのとき ψL − ψR が 180° を超えて −180° 側へ折り返し、
 * 結果が 360° 近くへ飛ぶ。なので最後に正規化する。
 */
function totalToe(psiL, psiR) {
  return wrap180(180 - (psiL - psiR));
}

/** 角度ではなくベクトルを足してから正規化した平均 */
function meanNormal(ns) {
  let x = 0, y = 0, z = 0;
  for (const n of ns) { x += n[0]; y += n[1]; z += n[2]; }
  const len = Math.hypot(x, y, z);
  return len > 0 ? [x / len, y / len, z / len] : null;
}

/** 2つの向きのなす角(度)。小さい角でも精度が落ちないよう atan2 で出す */
function angleBetween(a, b) {
  const c = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  return Math.atan2(Math.hypot(c[0], c[1], c[2]), a[0] * b[0] + a[1] * b[1] + a[2] * b[2]) / DEG;
}

function stdev(xs) {
  if (xs.length < 2) return 0;
  const m = xs.reduce((s, x) => s + x, 0) / xs.length;
  return Math.sqrt(xs.reduce((s, x) => s + (x - m) ** 2, 0) / (xs.length - 1));
}

/** 平均の向きからのずれの標準偏差(度)。水平(ψ)と縦(キャンバー)に分ける */
function spreadOf(ns, mean) {
  const psi0 = headingOf(mean), cam0 = camberOf(mean);
  return {
    psi: stdev(ns.map((n) => wrap180(headingOf(n) - psi0))),
    cam: stdev(ns.map((n) => camberOf(n) - cam0)),
  };
}

/**
 * 治具を上下逆にしたか。画面の右と上の z 成分([x.z, y.z])で見る。
 * 1回目に縦に近かった軸の z 成分の符号が逆になっていれば上下逆。重力が基準なので、向き(α)の基準が変わっても狂わない。
 * 当てる面はほぼ垂直なので、縦に近いほうの軸の |z| は 0.7 以上になる。
 */
function isFlipped(refZ, nowZ) {
  const k = Math.abs(refZ[0]) > Math.abs(refZ[1]) ? 0 : 1;
  return Math.sign(refZ[k]) !== Math.sign(nowZ[k]) && Math.abs(nowZ[k]) > 0.5;
}
// --- math:end ---

const LANG_KEY = 'reckon.lang.v1';
const isLang = (v) => v === 'ja' || v === 'en';

function loadLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (isLang(saved)) return saved;
  } catch (e) {
    // 読めなければ端末の言語で決める
  }
  return String(navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en';
}

let lang = loadLang();

/** 今の言語の文言。引数のある文言は関数にしてある */
function t(key, ...args) {
  const v = I18N[lang][key] ?? I18N.ja[key];
  return typeof v === 'function' ? v(...args) : v;
}

const errMsg = (e) => (e && e.message ? e.message : String(e));

// ---- 表示の書式 ----
const MINUS = '−';
function signed(x, digits) {
  const s = Math.abs(x).toFixed(digits);
  if (Number(s) === 0) return '±' + s;
  return (x < 0 ? MINUS : '+') + s;
}
const fmtDeg = (d, digits = 2) => signed(d, digits) + '°';
const fmtMin = (d) => signed(d * 60, 1) + '′';
const fmtMm = (mm) => signed(mm, 1) + ' mm';
const fmtDegMin = (d) => `${fmtDeg(d)}(${fmtMin(d)})`;

// ---- ログ(iPhone ではコンソールが見られないので、画面のデバッグパネルに出す) ----
// 書いたときの言語のまま残る(言語を切り替えても書き直さない)
const T0 = performance.now();
const logLines = [];
const LOG_MAX = 100;

function log(msg, level = 'info') {
  const line = { t: ((performance.now() - T0) / 1000).toFixed(1), msg, level };
  logLines.unshift(line);
  if (logLines.length > LOG_MAX) logLines.pop();
  const d = document.createElement('div');
  if (level !== 'info') d.className = level;
  d.textContent = `[${line.t}s] ${msg}`;
  const el = $('log');
  el.prepend(d);
  while (el.childElementCount > LOG_MAX) el.lastElementChild.remove();
}

window.addEventListener('error', (e) => log(t('logError', e.message, e.lineno, e.colno), 'bad'));
window.addEventListener('unhandledrejection', (e) => log(t('logPromiseError', errMsg(e.reason)), 'bad'));

// ---- 設定 ----
const SETTINGS_KEY = 'reckon.settings.v1';
const DEFAULTS = { stillTol: 0.15, stillSec: 1.5, maxTilt: 15, travelWarn: 15, rimInch: null, toeEdge: 'long' };
const LIMITS = { stillTol: [0.01, 2], stillSec: [0.3, 8], maxTilt: [1, 45], travelWarn: [1, 300], rimInch: [8, 30] };
const SETTING_INPUTS = { stillTol: 'setStillTol', stillSec: 'setStillSec', maxTilt: 'setMaxTilt', travelWarn: 'setTravelWarn', rimInch: 'setRim' };
const isEdge = (v) => v === 'long' || v === 'short';

const inRange = (k, v) => typeof v === 'number' && Number.isFinite(v) && v >= LIMITS[k][0] && v <= LIMITS[k][1];

function loadSettings() {
  const s = { ...DEFAULTS };
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    for (const k of Object.keys(LIMITS)) {
      if (inRange(k, saved[k])) s[k] = saved[k];
    }
    if (isEdge(saved.toeEdge)) s.toeEdge = saved.toeEdge;
  } catch (e) {
    // 読めなければ初期値のまま
  }
  return s;
}

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (e) {
    log(t('logSaveFail', e.message), 'warn');
  }
}

let settings = loadSettings();

function fillSettingInputs() {
  for (const [k, id] of Object.entries(SETTING_INPUTS)) {
    $(id).value = settings[k] === null ? '' : String(settings[k]);
    $(id).min = LIMITS[k][0];
    $(id).max = LIMITS[k][1];
  }
  $('setToeEdge').value = settings.toeEdge;
}

$('setToeEdge').addEventListener('change', () => {
  const v = $('setToeEdge').value;
  if (isEdge(v)) settings.toeEdge = v;
  fillSettingInputs();
  saveSettings();
  // 辺を変えると棒の向きの基準が変わるので、測りかけのトーは捨てる
  if (sensor.on && mode === 'toe') setState('waitL');
});

for (const [k, id] of Object.entries(SETTING_INPUTS)) {
  $(id).addEventListener('change', () => {
    const raw = $(id).value.trim();
    if ($(id).validity.badInput) {
      // 「15,5」のように数として読めない入力は、value が空になる。空欄(リム径を消す)と区別する
      log(t('logBadInput'), 'warn');
    } else if (k === 'rimInch' && raw === '') {
      settings.rimInch = null;
    } else {
      const v = parseFloat(raw);
      if (inRange(k, v)) {
        settings[k] = v;
      } else {
        log(t('logOutOfRange', LIMITS[k][0], LIMITS[k][1]), 'warn');
      }
    }
    fillSettingInputs();
    saveSettings();
    renderResult();
  });
}

$('btnDefaults').addEventListener('click', () => {
  settings = { ...DEFAULTS };
  fillSettingInputs();
  saveSettings();
  renderResult();
});

// ---- 合図(音と画面の点滅。iOS では振動 API が使えない) ----
let audioCtx = null;

/** タップの処理の中で呼ぶ(iOS ではタップ起点でないと音が出せない) */
function initAudio() {
  try {
    // 消音スイッチが入っていても鳴らす(Safari 16.4 以降)
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (e) {
    log(t('logAudioSession', e.message), 'warn');
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) {
      log(t('logNoWebAudio'), 'warn');
      return;
    }
    if (!audioCtx) audioCtx = new AC();
    audioCtx.resume().catch((e) => log(t('logAudioFail', e.message), 'warn'));
  } catch (e) {
    log(t('logAudioFail', e.message), 'warn');
  }
}

function beep(freq, delay = 0, dur = 0.15) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.6, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

function signal(times) {
  if (audioCtx && audioCtx.state !== 'running') {
    const st = audioCtx.state;
    audioCtx.resume().catch(() => log(t('logAudioResume', st), 'warn'));
  }
  for (let i = 0; i < times; i++) beep(1046, i * 0.2);
  const box = $('statusBox');
  box.classList.remove('flash');
  void box.offsetWidth; // アニメーションをやり直させる
  box.classList.add('flash');
}

// ---- 画面を点けたままにする ----
let wakeLockWarned = false;

async function keepAwake() {
  if (!('wakeLock' in navigator)) {
    // 画面を戻すたびに呼ばれるので、同じ警告は1回だけ
    if (!wakeLockWarned) log(t('logNoWakeLock'), 'warn');
    wakeLockWarned = true;
    return;
  }
  try {
    await navigator.wakeLock.request('screen');
  } catch (e) {
    log(t('logWakeLockFail', e.message), 'warn');
  }
}

// ---- センサー ----
const sensor = {
  on: false,
  ori: null,          // 最後の deviceorientation の生値
  n: null,            // 最後の法線
  ax: null,           // 最後の画面の右と上の向き [x, y]
  buf: [],            // 直近の { t, n, ax }
  stillSince: null,   // 静止が始まった時刻(静止していなければ null)
  wobble: null,       // 最後の向きと、静止区間の平均とのなす角(度)
  lastOri: null,      // 最後の deviceorientation の時刻
  rate: null,         // 最後の rotationRate の生値(°/s。デバッグの表示だけ)
  rateMag: null,
  interval: null,
  nulls: { ori: 0, mot: 0 },
  total: { ori: 0, mot: 0 },
  win: { ori: 0, mot: 0 },
  hz: { ori: 0, mot: 0 },
  hzT: performance.now(),
  res: { alpha: Infinity, beta: Infinity, gamma: Infinity }, // 続く値の差のうち 0 でない最小(分解能の目安)
};

/** バッファのうち、時刻 from 以降のもの */
function recentSamples(from) {
  let i = sensor.buf.length;
  while (i > 0 && sensor.buf[i - 1].t >= from) i--;
  return sensor.buf.slice(i);
}

/**
 * 静止の判定。最後の向きが、静止区間(長くても直近の「静止を続ける時間」)の平均から許容より離れたら、
 * そこから数え直す。手の震えは速いが向きはほとんど変わらないので通し、ゆっくり流れる動きは平均から離れるので止める。
 */
function updateStill(now, n, x) {
  if (sensor.stillSince === null) {
    sensor.stillSince = now;
    sensor.wobble = 0;
    return;
  }
  const win = recentSamples(Math.max(sensor.stillSince, now - settings.stillSec * 1000));
  const meanN = meanNormal(win.map((s) => s.n));
  const meanX = meanNormal(win.map((s) => s.ax[0]));
  // 法線だけだと、平らに置いたときの水平の回転が見えない。画面の右の向きも見れば、どの向きの回転も拾える
  sensor.wobble = meanN && meanX ? Math.max(angleBetween(n, meanN), angleBetween(x, meanX)) : 0;
  if (sensor.wobble > settings.stillTol) sensor.stillSince = now;
}

/** トーで使う、棒に沿わせた辺の向き(設定で長い辺か短い辺) */
const barAxis = (ax) => (settings.toeEdge === 'long' ? ax[1] : ax[0]);
/** 画面の右と上の z 成分(上下逆の判定に使う) */
const axesZ = (ax) => [ax[0][2], ax[1][2]];
/** 棒に沿わせた辺 a の、水平からの傾き(度) */
const tiltOf = (a) => Math.asin(Math.min(1, Math.abs(a[2]))) / DEG;
/** 今の向きを、記録してよいかの判定に使う形にする(u・tilt は棒の向きと傾き、z は上下逆の判定用) */
const poseOf = (ax) => ({ u: headingOf(barAxis(ax)), tilt: tiltOf(barAxis(ax)), z: axesZ(ax) });

function onOrientation(e) {
  if (e.alpha == null || e.beta == null || e.gamma == null) {
    sensor.nulls.ori++;
    return;
  }
  const now = performance.now();
  const prev = sensor.ori;
  if (prev) {
    for (const k of ['alpha', 'beta', 'gamma']) {
      const d = Math.abs(e[k] - prev[k]);
      if (d > 0 && d < sensor.res[k]) sensor.res[k] = d;
    }
  }
  sensor.ori = { alpha: e.alpha, beta: e.beta, gamma: e.gamma, absolute: e.absolute };
  sensor.n = normalFromEuler(e.alpha, e.beta, e.gamma);
  sensor.ax = axesFromEuler(e.alpha, e.beta, e.gamma);
  sensor.total.ori++;
  sensor.win.ori++;

  // 値が途切れていた間に動いたかどうかは分からないので、静止は数え直す
  if (sensor.lastOri !== null && now - sensor.lastOri > MAX_GAP_MS) {
    if (sensor.stillSince !== null) log(t('logGap', ((now - sensor.lastOri) / 1000).toFixed(1)));
    sensor.stillSince = null;
  }
  sensor.lastOri = now;

  sensor.buf.push({ t: now, n: sensor.n, ax: sensor.ax });
  const keep = Math.max(10, settings.stillSec + 3) * 1000;
  while (sensor.buf.length && sensor.buf[0].t < now - keep) sensor.buf.shift();

  updateStill(now, sensor.n, sensor.ax[0]);
  tryCapture(now);
}

function onMotion(e) {
  const r = e.rotationRate;
  if (!r || r.alpha == null || r.beta == null || r.gamma == null) {
    sensor.nulls.mot++;
    return;
  }
  sensor.rate = { alpha: r.alpha, beta: r.beta, gamma: r.gamma };
  sensor.rateMag = Math.hypot(r.alpha, r.beta, r.gamma);
  sensor.interval = e.interval;
  sensor.total.mot++;
  sensor.win.mot++;
}

const NOT_NEEDED = 'not-needed'; // requestPermission がない(iOS 以外)
let permDenied = false;

async function startSensors() {
  $('btnStart').disabled = true;
  try {
    await startSensorsInner();
  } catch (e) {
    log(t('logStartFail', errMsg(e)), 'bad');
    $('btnStart').disabled = false;
  }
}

async function startSensorsInner() {
  initAudio();
  if (!window.isSecureContext) log(t('logNotHttps'), 'bad');

  const DOE = window.DeviceOrientationEvent;
  const DME = window.DeviceMotionEvent;
  if (!DOE || !DME) log(t('logNoEvents'), 'bad');

  // 2つともタップの処理の中で同時に呼ぶ(await を挟むとタップ起点でなくなる)
  const ask = (C) => (C && typeof C.requestPermission === 'function' ? C.requestPermission() : Promise.resolve(NOT_NEEDED));
  const [o, m] = await Promise.allSettled([ask(DOE), ask(DME)]);
  const desc = (r) => {
    if (r.status !== 'fulfilled') return t('permFailed', errMsg(r.reason));
    return r.value === NOT_NEEDED ? t('permNotNeeded') : r.value;
  };
  log(t('logPermission', desc(o), desc(m)));
  const ok = (r) => r.status === 'fulfilled' && (r.value === 'granted' || r.value === NOT_NEEDED);
  if (!ok(o) || !ok(m)) {
    permDenied = true;
    renderStatic();
    $('btnStart').disabled = false;
    return;
  }

  window.addEventListener('deviceorientation', onOrientation);
  window.addEventListener('devicemotion', onMotion);
  sensor.on = true;
  keepAwake();
  setState(firstState());

  setTimeout(() => {
    if (sensor.total.ori === 0) log(t('logNoOri'), 'bad');
    if (sensor.total.mot === 0) log(t('logNoMot'), 'warn');
  }, 2000);
}

// ---- 測定の流れ ----
// トー:     idle → waitL(左前輪)→ waitR(右前輪)→ toeDone
// キャンバー: idle → waitC → camDone →(上下逆にするなら)waitCF → camDoneF
const FACING_TOL = 45; // 右前輪は左前輪のほぼ反対を向くはず。この角度より外れていたら記録しない
const MAX_GAP_MS = 300; // 向きの値がこれより長く途切れたら、静止を数え直す
// 静止がこれより短い間は、静止の秒数ではなく案内を出す。動いている間も静止は数え直し続けるので、秒数は 0 にならない
const STILL_SHOW_SEC = 0.2;
const MODE_KEY = 'reckon.mode.v1';

function loadMode() {
  try {
    const saved = localStorage.getItem(MODE_KEY);
    if (saved === 'toe' || saved === 'camber') return saved;
  } catch (e) {
    // 読めなければトー
  }
  return 'toe';
}

let mode = loadMode();
let state = 'idle';
let guard = '';  // 静止しているのに記録しない理由(向きの値が届くたびに作り直す)
let notice = ''; // 待っている画面に出すお知らせのキー(やり直しになった理由など)
const measure = { L: null, R: null, result: null, prevR: null, C1: null, C2: null };

const firstState = () => (mode === 'toe' ? 'waitL' : 'waitC');
const isWaiting = (s) => s === 'waitL' || s === 'waitR' || s === 'waitC' || s === 'waitCF';
const isDone = (s) => s === 'toeDone' || s === 'camDone' || s === 'camDoneF';

function setState(s) {
  if (s === 'waitL') {
    if (measure.R) measure.prevR = measure.R;
    measure.L = measure.R = measure.result = null;
  }
  if (s === 'waitC') measure.C1 = measure.C2 = null;
  if (s === 'waitCF') measure.C2 = null;
  state = s;
  sensor.stillSince = null;
  guard = '';
  notice = '';
  renderStatic();
  renderResult();
}

function setMode(m) {
  if (m === mode) return;
  mode = m;
  try {
    localStorage.setItem(MODE_KEY, m);
  } catch (e) {
    log(t('logSaveFail', e.message), 'warn');
  }
  measure.L = measure.R = measure.result = measure.C1 = measure.C2 = null;
  log(t('logMode', t(m === 'toe' ? 'modeToe' : 'modeCam')));
  if (sensor.on) {
    setState(firstState());
  } else {
    renderStatic();
    renderResult();
  }
}

/**
 * 今の向きで記録してはいけないなら、その理由を返す(move は動いている間、still は止まっているのに記録しないときの文言)。
 * トーは棒の向きで見る。棒は車の前を回って持っていくので、右前輪では左前輪のほぼ反対を向く。
 * 2回目以降の左前輪は、前回の右前輪の向きのままなら押し間違い。キャンバーの2回目は、1回目と上下逆になっていること。
 */
function facingProblem(pose) {
  // 棒に沿わせた辺が縦に近いと、その水平の向き(u)は意味がない。向きの確認より先に止める
  if ((state === 'waitL' || state === 'waitR') && pose.tilt > settings.maxTilt) {
    const msg = t('guardBarTilt', pose.tilt.toFixed(0), settings.maxTilt);
    // 右前輪へ歩いている間は、持ち方で傾いていて当然なので、移動の案内のままにする
    return { kind: 'barTilt', move: state === 'waitR' ? t('facingMove') : msg, still: msg };
  }
  if (state === 'waitL' && measure.prevR && Math.abs(wrap180(pose.u - measure.prevR.u)) < FACING_TOL) {
    const msg = t('facingPrevR');
    return { kind: 'prevR', move: msg, still: msg };
  }
  if (state === 'waitR') {
    const off = Math.abs(wrap180(pose.u - measure.L.u - 180));
    if (off > FACING_TOL) {
      // ずれの大きさは、ドリフトで外れたときの手がかり
      return { kind: 'notOpposite', move: t('facingMove'), still: t('facingStill', off.toFixed(0)) };
    }
  }
  if (state === 'waitCF' && !isFlipped(measure.C1.z, pose.z)) {
    const msg = t('flipMove');
    return { kind: 'notFlipped', move: msg, still: msg };
  }
  return null;
}

function tryCapture(now) {
  guard = '';
  if (!isWaiting(state)) return;
  if (sensor.stillSince === null || now - sensor.stillSince < settings.stillSec * 1000) return;

  const samples = recentSamples(now - settings.stillSec * 1000);
  if (samples.length < 5) {
    guard = t('guardFew');
    return;
  }
  if (mode === 'toe') captureToe(now, samples);
  else captureCamber(now, samples);
}

/**
 * トー:棒に沿わせた辺の向きの平均を記録する。棒を軸にあおっても(平らでも立てても)辺の向きは変わらないので、
 * 法線の向きで測るより、当て方のくせに強い。
 */
function captureToe(now, samples) {
  const bars = samples.map((s) => barAxis(s.ax));
  const a = meanNormal(bars);
  if (!a) return;
  const u = headingOf(a);
  const tilt = tiltOf(a);

  const fp = facingProblem({ u, tilt, z: null });
  if (fp) {
    guard = fp.still;
    return;
  }

  const sdU = stdev(bars.map((b) => wrap180(headingOf(b) - u)));
  const cap = { t: now, u, tilt, sdU, count: samples.length };
  const desc = t('capDescToe', u.toFixed(3), tilt.toFixed(2), (sdU * 60).toFixed(2), samples.length);
  if (state === 'waitL') {
    measure.L = cap;
    log(t('logCapL', desc));
    signal(1);
    setState('waitR');
  } else if (state === 'waitR') {
    measure.R = cap;
    const L = measure.L;
    // 棒は車の前を回って持っていくので、左右で反対を向く。法線のときと同じ式で、
    // 棒(辺)が車の前後どちらを向いていてもトータルトーになる(uR − uL − 180° = 右の前進方向 − 左の前進方向)
    measure.result = { toe: totalToe(L.u, cap.u), travel: (cap.t - L.t) / 1000 };
    log(t('logCapR', desc));
    log(t('logResult', measure.result.toe.toFixed(3), measure.result.travel.toFixed(1)));
    signal(2);
    setState('toeDone');
  }
}

/** キャンバー:法線の平均から出す。重力が基準なのでドリフトはない */
function captureCamber(now, samples) {
  const ns = samples.map((s) => s.n);
  const mean = meanNormal(ns);
  if (!mean) return;
  const z = [0, 1].map((k) => samples.reduce((acc, s) => acc + s.ax[k][2], 0) / samples.length);
  const cam = camberOf(mean);

  const fp = facingProblem({ u: null, tilt: 0, z });
  if (fp) {
    guard = fp.still;
    return;
  }
  if (Math.abs(cam) > settings.maxTilt) {
    guard = t('guardTilt', Math.abs(cam).toFixed(0), settings.maxTilt);
    return;
  }

  const sp = spreadOf(ns, mean);
  const cap = { t: now, n: mean, z, camber: cam, sdCam: sp.cam, count: samples.length };
  const desc = t('capDescCam', cam.toFixed(3), (sp.cam * 60).toFixed(2), samples.length);
  if (state === 'waitC') {
    measure.C1 = cap;
    log(t('logCapC', desc));
    signal(1);
    setState('camDone');
  } else {
    measure.C2 = cap;
    const c1 = measure.C1.camber;
    log(t('logCapCF', desc));
    log(t('logResultC', ((c1 + cap.camber) / 2).toFixed(3), ((c1 - cap.camber) / 2).toFixed(3)));
    signal(2);
    setState('camDoneF');
  }
}

// ボタンを押したついでに音の準備をし直す(画面のロックなどで止まった音は、タップでしか戻せない)
$('btnStart').addEventListener('click', startSensors);
$('btnReset').addEventListener('click', () => {
  initAudio();
  log(t('logRestart'));
  setState('waitL');
});
$('btnAgain').addEventListener('click', () => {
  initAudio();
  setState(firstState());
});
$('btnFlip').addEventListener('click', () => {
  initAudio();
  setState('waitCF');
});
$('btnForceL').addEventListener('click', () => {
  initAudio();
  measure.prevR = null;
  sensor.stillSince = null;
  log(t('logForceL'));
});
$('modeToe').addEventListener('click', () => setMode('toe'));
$('modeCam').addEventListener('click', () => setMode('camber'));

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    // 戻ったとき iOS は向き(α)の基準を取り直すことがあるので、隠れる前の向きは使わない。
    // キャンバーは重力が基準なので、上下逆の待ちはそのまま続けてよい
    sensor.stillSince = null;
    sensor.buf = [];
    measure.prevR = null;
    if (state === 'waitR') {
      setState('waitL');
      notice = 'noticeHidden';
      log(t(notice), 'warn');
    } else {
      log(t('logHidden'));
    }
  } else if (sensor.on) {
    keepAwake();
  }
});

// ---- 描画 ----
function setText(id, text, cls) {
  const el = $(id);
  if (el.textContent !== text) el.textContent = text;
  if (cls !== undefined && el.className !== cls) el.className = cls;
}

function renderStatic() {
  const [step, prompt] = t('steps')[state];
  setText('step', step);
  setText('prompt', prompt);
  if (state === 'idle') {
    if (!window.isSecureContext) setText('sub', t('notHttps'), 'sub warn');
    else if (permDenied) setText('sub', t('denied'), 'sub warn');
    else setText('sub', t('idleSub'), 'sub');
  }
  const toeMode = mode === 'toe';
  $('modeToe').setAttribute('aria-pressed', String(toeMode));
  $('modeCam').setAttribute('aria-pressed', String(!toeMode));
  $('btnStart').hidden = state !== 'idle';
  $('btnReset').hidden = state !== 'waitR';
  $('btnFlip').hidden = state !== 'camDone';
  $('btnAgain').hidden = !(isDone(state) || state === 'waitCF');
  if (state !== 'waitL') $('btnForceL').hidden = true;
  $('bar').hidden = state === 'idle';
  $('live').hidden = state === 'idle';
  $('boxCam').hidden = toeMode;
  $('boxTravel').hidden = !toeMode;
  $('boxToe').hidden = !toeMode;
}

function renderLive(now) {
  if (state === 'idle') return;
  const waiting = isWaiting(state);
  const still = sensor.stillSince !== null ? Math.max(0, (now - sensor.stillSince) / 1000) : 0;
  const n = sensor.n;
  const fp = waiting && sensor.ax ? facingProblem(poseOf(sensor.ax)) : null;
  const facing = fp ? fp.move : '';
  $('btnForceL').hidden = !(fp && fp.kind === 'prevR');

  // 記録しない理由があるときは、バーを満たさない(満タンを見て、記録できたと思わないように)
  let progress = facing || guard ? 0 : Math.min(1, still / settings.stillSec);
  if (isDone(state)) progress = 1;
  $('barFill').style.width = progress * 100 + '%';

  const stillShown = waiting && still >= STILL_SHOW_SEC;
  let sub;
  let warn = false;
  if (waiting && sensor.total.ori === 0) {
    sub = t('waitingSensor');
  } else if (waiting && guard) {
    sub = guard;
    warn = true;
  } else if (notice && !stillShown) {
    // やり直しになった理由は、移動の案内より先に出す(止まれば静止の秒数に替わる)
    sub = t(notice);
    warn = true;
  } else if (facing) {
    sub = facing;
  } else if (stillShown) {
    sub = t('stillProgress', still.toFixed(1), settings.stillSec);
  } else if (waiting) {
    sub = t(mode === 'toe' ? 'placeHintToe' : 'placeHintCam');
  } else {
    sub = t({ toeDone: 'toeDoneHint', camDone: 'camDoneHint', camDoneF: 'camDoneFHint' }[state]);
  }
  setText('sub', sub, warn ? 'sub warn' : 'sub');

  setText('liveWobble', sensor.wobble === null ? '–' : sensor.wobble.toFixed(2) + '°',
    sensor.wobble !== null && sensor.wobble <= settings.stillTol ? 'ok' : '');

  if (mode === 'camber') {
    const cam = n ? camberOf(n) : null;
    setText('liveCam', cam === null ? '–' : fmtDeg(cam, 2), cam !== null && Math.abs(cam) > settings.maxTilt ? 'warn' : '');
    return;
  }

  const r = measure.result;
  let travel = null;
  if (state === 'waitR') travel = (now - measure.L.t) / 1000;
  if (state === 'toeDone') travel = r.travel;
  setText('liveTravel', travel === null ? '–' : t('seconds', travel.toFixed(1)), travel !== null && travel > settings.travelWarn ? 'bad' : '');

  let toe = '–';
  if (state === 'waitR' && sensor.ax && !facing) {
    toe = fmtDeg(totalToe(measure.L.u, poseOf(sensor.ax).u), 2);
  } else if (state === 'toeDone') {
    toe = fmtDeg(r.toe, 2);
  }
  setText('liveToe', toe);
}

function renderResult() {
  renderToeResult();
  renderCamResult();
}

function renderToeResult() {
  const r = measure.result;
  $('resultToe').hidden = !r;
  if (!r) return;
  const { L, R } = measure;

  setText('rToe', fmtDeg(r.toe, 2));
  // イン・アウトは、細かいほうの表示(分)に合わせて決める。0 に丸まるときは付けない
  const toeMin = Number((r.toe * 60).toFixed(1));
  const parts = [fmtMin(r.toe)];
  if (toeMin !== 0) parts.push(toeMin > 0 ? t('toeIn') : t('toeOut'));
  if (settings.rimInch !== null) {
    parts.push(fmtMm(settings.rimInch * 25.4 * Math.tan(r.toe * DEG)) + t('rim', settings.rimInch));
  }
  setText('rToeSub', parts.join(t('sep')));
  setText('rTravel', t('seconds', r.travel.toFixed(1)), r.travel > settings.travelWarn ? 'bad' : '');
  const sd = (c) => t('spreadH', (c.sdU * 60).toFixed(2), c.count);
  setText('rSdL', sd(L));
  setText('rSdR', sd(R));
  setText('rPsi', `${L.u.toFixed(2)}° / ${R.u.toFixed(2)}°`);

  const notes = [];
  if (r.travel > settings.travelWarn) {
    notes.push(t('noteTravel', r.travel.toFixed(1), settings.travelWarn));
  }
  $('rNotes').replaceChildren(...notes.map((s) => {
    const p = document.createElement('p');
    p.className = 'warn';
    p.textContent = s;
    return p;
  }));
}

function renderCamResult() {
  const { C1, C2 } = measure;
  $('resultCam').hidden = !C1;
  if (!C1) return;
  // 上下逆の2回の平均で、iPhone の付け方の傾きが消える(付け方の傾きは差の半分)
  const cam = C2 ? (C1.camber + C2.camber) / 2 : C1.camber;
  setText('rCam', fmtDeg(cam, 2));
  setText('rCamSub', C2 ? fmtMin(cam) + t('sep') + t('camAvg') : fmtMin(cam));
  $('rowCam1').hidden = $('rowCam2').hidden = $('rowOffset').hidden = !C2;
  if (C2) {
    setText('rCam1', fmtDegMin(C1.camber));
    setText('rCam2', fmtDegMin(C2.camber));
    setText('rOffset', fmtDegMin((C1.camber - C2.camber) / 2));
  }
  setText('rSdC', [C1, C2].filter(Boolean).map((c) => t('spreadV', (c.sdCam * 60).toFixed(2), c.count)).join(' / '));
}

/** 等幅フォントでの幅(全角は2) */
const textWidth = (s) => [...s].reduce((w, c) => w + (c.codePointAt(0) >= 0x2e80 ? 2 : 1), 0);
const padLabel = (s) => s + ' '.repeat(Math.max(1, 10 - textWidth(s)));

function renderDebug(now) {
  const dt = (now - sensor.hzT) / 1000;
  if (dt >= 1) {
    sensor.hz.ori = sensor.win.ori / dt;
    sensor.hz.mot = sensor.win.mot / dt;
    sensor.win.ori = sensor.win.mot = 0;
    sensor.hzT = now;
  }
  const L = t('dbg');
  const raw = (x) => (x === null || x === undefined ? '–' : String(x));
  const fix = (x, d) => (x === null || x === undefined ? '–' : x.toFixed(d));
  const res = (x) => (x === Infinity ? '–' : x.toPrecision(3));
  const hasReq = (C) => (C && typeof C.requestPermission === 'function' ? L.yes : L.no);
  const o = sensor.ori;
  const r = sensor.rate;
  const n = sensor.n;
  const still = sensor.stillSince !== null ? t('seconds', ((now - sensor.stillSince) / 1000).toFixed(2)) : '–';
  const lines = [
    [L.state, `${state} (${mode})`],
    ['HTTPS', `${window.isSecureContext}  requestPermission ${L.ori}=${hasReq(window.DeviceOrientationEvent)} ${L.mot}=${hasReq(window.DeviceMotionEvent)}`],
    [L.ori, `${sensor.hz.ori.toFixed(1)} Hz  ${L.total} ${sensor.total.ori}  null ${sensor.nulls.ori}  absolute=${o ? o.absolute : '–'}`],
    ['  α', raw(o && o.alpha)],
    ['  β', raw(o && o.beta)],
    ['  γ', raw(o && o.gamma)],
    ['  ' + L.res, `α ${res(sensor.res.alpha)}  β ${res(sensor.res.beta)}  γ ${res(sensor.res.gamma)}`],
    [L.mot, `${sensor.hz.mot.toFixed(1)} Hz  ${L.total} ${sensor.total.mot}  null ${sensor.nulls.mot}  interval=${raw(sensor.interval)}`],
    ['  ω', `α ${fix(r && r.alpha, 3)}  β ${fix(r && r.beta, 3)}  γ ${fix(r && r.gamma, 3)} °/s`],
    ['  |ω|', `${fix(sensor.rateMag, 3)} °/s`],
    [L.normal, n ? n.map((v) => v.toFixed(5)).join(', ') : '–'],
    ['ψ', `${n ? headingOf(n).toFixed(3) + '°' : '–'}   ${L.camber} ${n ? camberOf(n).toFixed(3) + '°' : '–'}`],
    [L.bar, sensor.ax ? `${poseOf(sensor.ax).u.toFixed(3)}° (${settings.toeEdge})` : '–'],
    [L.wobble, `${fix(sensor.wobble, 3)}° (${L.tol} ${settings.stillTol}°)`],
    [L.still, `${still}  ${L.buffer(sensor.buf.length)}`],
  ];
  setText('dbg', lines.map(([k, v]) => padLabel(k) + v).join('\n'));
}

$('btnCopy').addEventListener('click', async () => {
  const text = [
    $('dbg').textContent,
    '',
    ...logLines.map((l) => `[${l.t}s] ${l.msg}`),
    '',
    navigator.userAgent,
  ].join('\n');
  try {
    await navigator.clipboard.writeText(text);
    log(t('logCopied'));
  } catch (e) {
    log(t('logCopyFail', e.message), 'warn');
  }
});

// ---- 言語 ----
function applyLang() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  $('langSel').value = lang;
  const now = performance.now();
  renderStatic();
  renderResult();
  renderLive(now);
  renderDebug(now);
}

$('langSel').addEventListener('change', () => {
  const v = $('langSel').value;
  if (!isLang(v)) return;
  lang = v;
  try {
    localStorage.setItem(LANG_KEY, lang);
  } catch (e) {
    log(t('logSaveFail', e.message), 'warn');
  }
  applyLang();
});

// ---- 起動 ----
fillSettingInputs();
applyLang();
let tick = 0;
setInterval(() => {
  const now = performance.now();
  renderLive(now);
  if (tick++ % 2 === 0) renderDebug(now);
}, 100);
</script>
</body>
